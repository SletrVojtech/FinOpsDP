---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: {{ .Release.Namespace }}
  labels:
    department: monitor
    app: webapp
spec:
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 8080        
      targetPort: 8080  
  type: ClusterIP     

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: {{ .Release.Namespace }}
  labels:
    department: monitor
    app: webapp
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        department: monitor
        app: webapp
    spec:
      containers:
      - name: webapp
        image: {{ .Values.image.repository }}/finops-webapp:{{ .Values.image.tag }}
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        envFrom:
        - secretRef:
            name: app-env-vars
        - secretRef:
            name: web-env-vars