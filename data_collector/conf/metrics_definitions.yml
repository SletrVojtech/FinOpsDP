metrics_dictionary:
  cpu_usage:
    aws: "CPUUtilization"
    azure: "Percentage CPU"
  mem_used:
    azure: "Available Memory Percentage" # inverted values done by MetricDefinitions
    # aws doesn't export natively
  net_in:
    azure: "Network In Total"
    aws: "NetworkIn"
  net_out:
    azure: "Network Out Total"
    aws: "NetworkOut"
  disk_read_bytes:
    aws: "EBSReadBytes"
    azure: "Disk Read Bytes"
  disk_write_bytes:
    aws: "EBSWriteBytes"
    azure: "Disk Write Bytes"
  disk_read_ops:
    aws: "EBSReadOps"
    azure: "Disk Read Operations/Sec"
  disk_write_ops:
    aws: "EBSWriteOps"
    azure: "Disk Write Operations/Sec"
  disk_write:
    # for azure.disk and aws.EBS
    aws: "VolumeWriteBytes"
    azure: "Composite Disk Write Bytes/sec"
  disk_read:
    # for azure.disk and aws.EBS
    aws: "VolumeReadBytes"
    azure: "Composite Disk Read Bytes/sec"
  
