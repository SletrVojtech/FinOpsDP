services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: finops_timescaledb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-finops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finops_password}
      POSTGRES_DB: ${DB_NAME:-finops_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finops} -d ${DB_NAME:-finops_db}"]
      interval: 1s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finops_rabbitmq
    env_file:
      - data_collector/.env.collector
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-finops}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD:-finops_password}
    ports:
      - "${RMQ_HOST_PORT:-5672}:5672"
      - "${RMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  db_init:
    build:
      context: ./data_collector
      dockerfile: Dockerfile
    container_name: finops_db_init
    env_file:
      - .env
      - data_collector/.env.collector
    command: ["python3", "db_init/db_init.py"]
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy

  db_loader:
    build: 
      context: ./data_collector
      dockerfile: Dockerfile
    container_name: finops_db_loader
    env_file:
      - .env
      - data_collector/.env.collector
    command: ["python3", "run_policies.py", "loader"]
    restart: unless-stopped
    depends_on:
      db_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  scheduler:
    build: 
      context: ./data_collector
      dockerfile: Dockerfile
    container_name: finops_scheduler
    env_file:
      - .env
      - data_collector/.env.collector
    environment:
      KUBECONFIG: /root/.kube/config
    volumes:
      - type: bind
        source: "${KUBECONFIG_PATH}"
        target: /root/.kube/config
        read_only: true
    command: ["python3", "run_policies.py", "scheduler"]
    restart: unless-stopped
    depends_on:
      db_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  krr_collector:
    build: 
      context: ./data_collector
      dockerfile: Dockerfile.krr
    container_name: finops_krr
    env_file:
      - .env
      - data_collector/.env.collector
    environment:
      KUBECONFIG: /root/.kube/config
    depends_on:
      db_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - ${KUBECONFIG_PATH}:/root/.kube/config:ro
    command: ["python3", "run_krr.py"]

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: finops_webapp
    env_file:
      - .env
      - webapp/.env.web
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      db_init:
        condition: service_completed_successfully
  
  forecast_worker:
    build: 
      context: ./webapp
      dockerfile: Dockerfile
    container_name: finops_forecast_worker
    env_file:
      - .env
      - webapp/.env.web
    command: ["python3", "run_worker.py", "--job", "fbad"]
    restart: "no"
    depends_on:
      db_init:
        condition: service_completed_successfully

volumes:
  timescaledb_data:
  rabbitmq_data: