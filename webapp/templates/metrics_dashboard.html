<div class="mb-4">
    <button class="btn btn-outline" hx-get="/ui/scope/{{ scope_id if scope_id else '' }}?{{ current_qs }}" hx-target="#app-content" hx-swap="innerHTML">
        Zpět na seznam zdrojů
    </button>
</div>

<div class="card mb-4">
    <div class="card-header">
        <h2 class="mb-0">Detailní metriky: {{ entity_name }}</h2>
        <div class="text-sm text-muted mt-1">ID zdroje: {{ entity_id }}</div>
    </div>
    
    <div class="card-body">
        <div class="flex flex-wrap gap-4 mb-4 items-center">
            <div class="flex items-center gap-2">
                <label for="timeRangeSelect" class="font-medium text-sm">Časové okno:</label>
                <select id="timeRangeSelect" class="btn btn-outline" style="padding: 4px 8px;">
                    <option value="24 hours">Posledních 24 hodin</option>
                    <option value="7 days" selected>Posledních 7 dní</option>
                    <option value="30 days">Posledních 30 dní</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label for="granularitySelect" class="font-medium text-sm">Granularita:</label>
                <select id="granularitySelect" class="btn btn-outline" style="padding: 4px 8px;">
                    <option value="5 minutes">5 minut</option>
                    <option value="1 hour" selected>1 hodina</option>
                    <option value="1 day">1 den</option>
                </select>
            </div>
        </div>

        <div id="recommendation-panel" class="mb-4" style="background: rgba(16, 185, 129, 0.05); padding: 16px; border-radius: 8px; border-left: 4px solid var(--color-primary);">
            <h3 class="mb-2" style="color: var(--color-primary);">Doporučení</h3>
            <div id="recommendation-content" class="text-sm">
                <p>Počítám doporučení</p>
            </div>
        </div>

        <div id="charts-container" class="grid grid-cols-2">
            {% for metric in available_metrics %}
                <div class="card p-2" style="box-shadow: none;">
                    <h3 class="text-sm text-muted mb-2 text-center">{{ metric }}</h3>
                    <canvas class="metric-chart" data-entity="{{ entity_id }}" data-metric="{{ metric }}"></canvas>
                </div>
            {% else %}
                <p class="text-muted">Nenalezeny žádné metriky k vykreslení.</p>
            {% endfor %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    window.chartInstances = window.chartInstances || {};
    // Mapping of the charted value per metric name
    function getChartConfig(metricName) {
        const nameLower = metricName.toLowerCase();
        
        if (nameLower.includes('max')) {
            return [{ key: 'max', label: 'Maximum', color: 'red' }];
        } 
        else if (nameLower.includes('sum')) {
            return [{ key: 'sum', label: 'Celkem (Sum)', color: 'green' }];
        }
        else if (nameLower.includes('avg')) {
            return [{ key: 'avg', label: 'Průměr (Avg)', color: 'blue' }];
        }
        else if (nameLower.includes('min')) {
            return [{ key: 'min', label: 'Minimum', color: 'light-blue' }];
        }
        else {
            return [
                { key: 'avg', label: 'Průměr', color: 'blue' },
                { key: 'max', label: 'Maximum', color: 'red' }
            ];
        }
    }

async function renderAllCharts() {
    const timeRange = document.getElementById('timeRangeSelect').value;
    const granularity = document.getElementById('granularitySelect').value;

    // Based on https://www.chartjs.org/docs/latest/getting-started/usage.html
    // Chart creation logic
    document.querySelectorAll('.metric-chart').forEach(async (canvas) => {
        const entityId = canvas.dataset.entity;
        const metricName = canvas.dataset.metric;
        const chartId = entityId + '_' + metricName;

        try {

            if (chartInstances[chartId]) {
                    chartInstances[chartId].destroy();
                }

            // Get data for given metric name
            const response = await fetch(`/api/v1/metrics/${entityId}/data?metric_name=${metricName}&time_range=${timeRange}&granularity=${granularity}`);
            const result = await response.json();
            const dataPoints = result.data_points;
            
            // X axis
            const labels = dataPoints.map(dp => {
                const date = new Date(dp.time);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            });

            const configMap = getChartConfig(metricName);
            
            // Get data for Y axis based on metric name
            const datasets = configMap.map(config => {
                return {
                    label: config.label,
                    data: dataPoints.map(dp => dp[config.key]), 
                    borderColor: config.color,
                    backgroundColor: config.color.replace('1)', '0.1)'),
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3
                };
            });

            // Plotting by Chart.js
            chartInstances[chartId] = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
            
        } catch (error) {
            console.error(`Error during chart creation: ${metricName}:`, error);
        }
    });
    }

    // Get the days from time range
    function getAnalysisDays(timeRangeString) {
        if (timeRangeString.includes('hours')) return 1;
        const match = timeRangeString.match(/\d+/);
        return match ? parseInt(match[0]) : 30;
    }

    // Get a rightsizing reccomendation
    async function fetchRecommendation() {
        const entityId = "{{ entity_id }}";
        const timeRange = document.getElementById('timeRangeSelect').value;
        const analysisDays = getAnalysisDays(timeRange);
        
        const contentDiv = document.getElementById('recommendation-content');
        contentDiv.innerHTML = '<p>Počítám doporučení na základě vybraného období</p>';

        try {
            const response = await fetch(`/api/v1/downsizing/${entityId}?analysis_days=${analysisDays}&scope_id={{ scope_id }}`);
            const data = await response.json();

            if (data.status === "error") {
                contentDiv.innerHTML = `<p style="color: red;">Chyba: ${data.message}</p>`;
                return;
            }

            if (data.status === "unsupported") {
                contentDiv.innerHTML = `<p>${data.message}</p>`;
                return;
            }

            if (data.action === "none") {
                contentDiv.innerHTML = `<p> <strong>${data.message || "Instance je optimální."}</strong> (Současný typ: ${data.current_instance || "Neznámý"})</p>`;
                return;
            }

            // Better option was found
            if (data.action === "downsize_recommended") {
                const recsHtml = data.recommendations.map(rec => {
                    let warningsHtml = '';
                    if (rec.warnings && rec.warnings.length > 0) {
                        warningsHtml = `
                        <div class="mt-2 text-sm text-yellow-600 p-2 rounded" style="background-color: var(--color-surface); border-left: 4px solid #F59E0B; margin-bottom: 8px;">
                            <strong>Upozornění:</strong> Doporučená instance nemá všechny původní vlastnosti: ${rec.warnings.join(', ')}
                        </div>`;
                    }
                    
                    if (rec.financials) {
                        const fin = rec.financials;
                        return `
                        <div class="mb-4 pb-2" style="border-bottom: 1px solid var(--color-border);">
                            <p><strong>Doporučená změna:</strong> Změnit z <code>${data.current_instance}</code> na <code style="color: green; font-size: 1.1em;">${rec.recommended_instance}</code></p>
                            ${warningsHtml}
                            <ul>
                                <li>Odhadovaná měsíční úspora: <strong>€${fin.estimated_monthly_savings_eur}</strong> (${fin.savings_percentage}% dolů)</li>
                                <li>Současná denní cena: €${data.current_actual_daily_cost_eur} -> Nová denní cena: €${fin.projected_daily_cost_eur}</li>
                            </ul>
                        </div>`;
                    } else {
                        return `
                        <div class="mb-4 pb-2" style="border-bottom: 1px solid var(--color-border);">
                            <p><strong>Doporučená změna:</strong> Změnit z <code>${data.current_instance}</code> na <code style="color: green; font-size: 1.1em;">${rec.recommended_instance}</code></p>
                            ${warningsHtml}
                        </div>`;
                    }
                }).join('');

                const telemetryText = data.telemetry_used 
                    ? `(Vypočteno na základě ${analysisDays} dní. Max CPU P95: ${data.telemetry_used.cpu_p95}%)`
                    : '';

                contentDiv.innerHTML = `
                    ${recsHtml}
                    <p style="font-size: 0.9em; color: #666;">
                        ${telemetryText}
                    </p>
                `;
            }

        } catch (error) {
            console.error("Chyba při stahování doporučení:", error);
            contentDiv.innerHTML = `<p style="color: red;">Nepodařilo se načíst doporučení.</p>`;
        }
    }

    // Recalculate reccomendation on time change
    document.getElementById('timeRangeSelect').addEventListener('change', fetchRecommendation);

    // first run
    fetchRecommendation();

    // Recalculate on change
    document.getElementById('timeRangeSelect').addEventListener('change', renderAllCharts);
    document.getElementById('granularitySelect').addEventListener('change', renderAllCharts);

    // Chart the first time
    renderAllCharts();
</script>
