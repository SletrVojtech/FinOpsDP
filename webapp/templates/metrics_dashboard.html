<div>
    
    <button hx-get="/ui/scope/{{ scope_id if scope_id else '' }}?{{ current_qs }}"
            hx-target="#app-content"
            hx-swap="innerHTML">
        Zpět na seznam zdrojů
    </button>

    <h2>Detailní metriky: {{ entity_name }}</h2>
    <p >ID zdroje: {{ entity_id }}</p>


    <div >
        <div>
            <label for="timeRangeSelect" style="font-weight: bold; margin-right: 10px;">Časové okno:</label>
            <select id="timeRangeSelect" style="padding: 5px;">
                <option value="24 hours">Posledních 24 hodin</option>
                <option value="7 days" selected>Posledních 7 dní</option>
                <option value="30 days">Posledních 30 dní</option>
            </select>
        </div>
        <div>
            <label for="granularitySelect" style="font-weight: bold; margin-right: 10px;">Granularita:</label>
            <select id="granularitySelect" style="padding: 5px;">
                <option value="5 minutes">5 minut</option>
                <option value="1 hour" selected>1 hodina</option>
                <option value="1 day">1 den</option>
            </select>
        </div>
    </div>

    <div id="charts-container" >
        {% for metric in available_metrics %}
            <div >
                <h3>{{ metric }}</h3>
                <canvas class="metric-chart" data-entity="{{ entity_id }}" data-metric="{{ metric }}"></canvas>
            </div>
        {% else %}
            <p>Nenalezeny žádné metriky k vykreslení.</p>
        {% endfor %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    window.chartInstances = window.chartInstances || {};
    // Mapping of the charted value per metric name
    function getChartConfig(metricName) {
        const nameLower = metricName.toLowerCase();
        
        if (nameLower.includes('max')) {
            return [{ key: 'max', label: 'Maximum', color: 'red' }];
        } 
        else if (nameLower.includes('sum')) {
            return [{ key: 'sum', label: 'Celkem (Sum)', color: 'green' }];
        }
        else if (nameLower.includes('avg')) {
            return [{ key: 'avg', label: 'Průměr (Avg)', color: 'blue' }];
        }
        else if (nameLower.includes('min')) {
            return [{ key: 'min', label: 'Minimum', color: 'light-blue' }];
        }
        else {
            return [
                { key: 'avg', label: 'Průměr', color: 'blue' },
                { key: 'max', label: 'Maximum', color: 'red' }
            ];
        }
    }

async function renderAllCharts() {
    const timeRange = document.getElementById('timeRangeSelect').value;
    const granularity = document.getElementById('granularitySelect').value;

    // Based on https://www.chartjs.org/docs/latest/getting-started/usage.html
    // Chart creation logic
    document.querySelectorAll('.metric-chart').forEach(async (canvas) => {
        const entityId = canvas.dataset.entity;
        const metricName = canvas.dataset.metric;
        const chartId = entityId + '_' + metricName;

        try {

            if (chartInstances[chartId]) {
                    chartInstances[chartId].destroy();
                }

            // Get data for given metric name
            const response = await fetch(`/api/v1/metrics/${entityId}/data?metric_name=${metricName}&time_range=${timeRange}&granularity=${granularity}`);
            const result = await response.json();
            const dataPoints = result.data_points;
            
            // X axis
            const labels = dataPoints.map(dp => {
                const date = new Date(dp.time);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            });

            const configMap = getChartConfig(metricName);
            
            // Get data for Y axis based on metric name
            const datasets = configMap.map(config => {
                return {
                    label: config.label,
                    data: dataPoints.map(dp => dp[config.key]), 
                    borderColor: config.color,
                    backgroundColor: config.color.replace('1)', '0.1)'),
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3
                };
            });

            // Plotting by Chart.js
            chartInstances[chartId] = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
            
        } catch (error) {
            console.error(`Error during chart creation: ${metricName}:`, error);
        }
    });
    }

    // Recalculate on change
    document.getElementById('timeRangeSelect').addEventListener('change', renderAllCharts);
    document.getElementById('granularitySelect').addEventListener('change', renderAllCharts);

    // Chart the first time
    renderAllCharts();
</script>
