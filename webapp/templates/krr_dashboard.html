<h2>KRR Doporučení - Výběr clusteru</h2>
<p><a href="/">← Zpět</a></p>
<ul>
    {% for cluster in clusters %}
    <li>
        <a href="/ui/krr/{{ cluster.cluster_id }}">{{ cluster.cluster_name }}</a>
        <small>(Poslední sken: {{ cluster.latest_scan.strftime('%Y-%m-%d %H:%M') }})</small>
    </li>
    {% else %}
    <li>Zatím žádná data z KRR.</li>
    {% endfor %}
</ul>
