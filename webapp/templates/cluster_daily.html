<div class="mb-4">
    <button class="btn btn-outline" hx-get="/ui/clusters" hx-target="#app-content">
        &larr; Zpět na seznam clusterů
    </button>
</div>

<div class="card mb-4">
    <div class="card-header flex justify-between items-center">
        <div>
            <h2 id="monthTitle" class="mb-0">Denní náklady na namespaces ({{ month }})</h2>
            <div class="text-muted text-sm mt-1">Cluster: {{ cluster_name }}</div>
        </div>
        <div class="flex items-center gap-2">
            <label for="monthSelect" class="font-medium text-sm">Zúčtovací měsíc:</label>
            <input type="month" id="monthSelect" value="{{ month }}" class="btn btn-outline" style="padding: 4px 8px;">
        </div>
    </div>
    <div class="card-body">
        <div class="chart-container" style="width: 100%; margin: 0 auto;">
            <canvas id="costChart"></canvas>
        </div>
    </div>
</div>

<script>
    (function() {
        let costChartInstance = null;
        const colors = [
            '#10b981', '#3b82f6', '#8b5cf6', '#f59e0b', '#ef4444', 
            '#14b8a6', '#6366f1', '#ec4899', '#f97316', '#64748b'
        ];

        function buildChart(chartData) {
            if (costChartInstance) {
                costChartInstance.destroy();
            }

            chartData.datasets.forEach((dataset, index) => {
                dataset.backgroundColor = colors[index % colors.length];
            });

            const canvas = document.getElementById('costChart');
            if (!canvas) return; // HTMX cleanup guard
            const ctx = canvas.getContext('2d');
            
            costChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.labels,
                    datasets: chartData.datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y.toFixed(2) + ' €';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, beginAtZero: true }
                    }
                }
            });
        }

        async function updateData() {
            const monthInput = document.getElementById('monthSelect');
            if(!monthInput) return;
            const month = monthInput.value;
            const clusterId = "{{ cluster_id }}";
            const url = `/ui/clusters/${clusterId}/costs?target_month=${month}`;

            try {
                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                buildChart(data.chart_data);
                
                const titleNode = document.getElementById('monthTitle');
                if(titleNode) {
                    titleNode.innerText = `Denní náklady na namespaces (${data.month})`;
                }
            } catch (error) {
                console.error('Error fetching cluster data:', error);
            }
        }

        const selectNode = document.getElementById('monthSelect');
        if(selectNode) {
            selectNode.addEventListener('change', updateData);
        }

        // Initial render using chart_data injected by Jinja
        const initialData = {{ chart_data | tojson | safe }};
        buildChart(initialData);
    })();
</script>
