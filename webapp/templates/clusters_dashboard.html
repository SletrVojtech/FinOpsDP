<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Výběr clusteru</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 10px; }
        a { text-decoration: none; color: #0056b3; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h2>FinOps: Rozpad nákladů na Kubernetes clustery</h2>
    <a href="/">Zpět</a>
    <p>Vyberte cluster pro zobrazení denních nákladů podle namespace:</p>

    <ul>
        {% for cluster in clusters %}
        <li>
            <a href="/ui/clusters/{{ cluster.id }}/costs">{{ cluster.name }}</a>
        </li>
        {% else %}
        <li>Nenalezeny žádné clustery.</li>
        {% endfor %}
    </ul>

</body>
</html>
