<div class="card mb-4" style="border: 1px solid var(--color-border); background: var(--color-bg-alt);">
    <div class="card-header p-2 flex justify-between items-center">
        <h4 class="text-sm m-0">Omezení pro downsizing instancí</h4>
        <button type="button" class="btn btn-ghost text-xs" style="padding: 2px 8px;"
                onclick="document.getElementById('downsizing-rules-wrapper').hidden = true">
            Zavřít ✖
        </button>
    </div>

    
    <div id="downsizing-rules-body" class="card-body p-3">

        <p class="text-xs mb-3 text-muted">
            Tato omezení budou automaticky použita pro všechna doporučení v tomto rozsahu a s těmito tagy.
            Můžete použít SQL wildcards (např. <code>t3.%</code>).
        </p>

        <form hx-post="/ui/downsizing-rules?scope_id={{ scope_id }}&{{ current_qs }}" 
              hx-target="#downsizing-rules-wrapper" 
              hx-swap="innerHTML">
            
            <div class="mb-3">
                <label class="text-xs font-medium block mb-1">Vyloučené typy (oddělené čárkou):</label>
                <input type="text" name="excluded_patterns" 
                       value="{{ patterns | join(', ') }}" 
                       class="btn btn-outline w-full text-left font-normal" 
                       style="padding: 6px 10px; cursor: text;"
                       placeholder="Např. burstable, t3.%, m5.large">
            </div>

            <button type="submit" class="btn btn-primary text-xs" style="padding: 4px 12px;">
                Uložit nastavení
            </button>
        </form>
    </div>
</div>
