<div style="display: flex; gap: 8px; flex-wrap: wrap;">
    {% for val in values %}
        <button 
            hx-get="/ui/scope/{{ scope_id }}?{{ current_qs }}&tag_{{ tag_key }}={{ val.value }}" 
            hx-target="#app-content" 
            hx-swap="innerHTML"
            style="padding: 5px 10px; background: #fff; border: 1px solid #ccc; border-radius: 15px; cursor: pointer;">
            
            {% if val.value == "" %}<i>(Bez hodnoty)</i>{% else %}{{ val.value }}{% endif %}
            <span>({{ val.count }})</span>
        </button>
    {% endfor %}
</div>
