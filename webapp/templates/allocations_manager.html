<div class="mb-4">
    <button class="btn btn-outline mb-4" hx-get="/ui/scope/0" hx-target="#app-content" hx-swap="innerHTML">
    Zpět na seznam zdrojů
    </button>
    <h2>Správa sdílených nákladů</h2>
</div>

<div class="card mb-4" style="max-width: 800px;">
    <div class="card-header">
        <h4 class="mb-0">Přidat nové pravidlo</h4>
    </div>
    <div class="card-body">
        <div class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="text-sm font-medium text-muted block mb-1">Název pravidla</label>
                <input type="text" id="ruleName" placeholder="Např. Sdílení marketingu" class="btn btn-outline" style="text-align: left; width: 220px; padding: 6px 12px; cursor: text;">
            </div>
            <div>
                <label class="text-sm font-medium text-muted block mb-1">Zdrojové Tagy</label>
                <input type="text" id="sourceTags" placeholder='{"env": "shared"}' class="btn btn-outline" style="text-align: left; width: 180px; padding: 6px 12px; cursor: text;">
            </div>
            <div>
                <label class="text-sm font-medium text-muted block mb-1">Cílové Tagy</label>
                <input type="text" id="targetTags" placeholder='{"team": "frontend"}' class="btn btn-outline" style="text-align: left; width: 180px; padding: 6px 12px; cursor: text;">
            </div>
            <div>
                <label class="text-sm font-medium text-muted block mb-1">Procento</label>
                <input type="number" id="rulePercentage" placeholder="40" step="0.1" class="btn btn-outline" style="text-align: left; width: 100px; padding: 6px 12px; cursor: text;">
            </div>
            <button onclick="saveRule()" class="btn btn-primary" style="height: 38px;">
                Přidat
            </button>
        </div>
    </div>
</div>

<div class="card">
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Název</th>
                    <th>Zdroj</th>
                    <th>Cíl</th>
                    <th>%</th>
                    <th>Akce</th>
                </tr>
            </thead>
            <tbody>
                {% for rule in rules %}
                <tr>
                    <td>{{ rule.id }}</td>
                    <td class="font-medium">{{ rule.rule_name }}</td>
                    <td><code class="text-sm badge badge-neutral">{{ rule.source_tags | tojson }}</code></td>
                    <td><code class="text-sm badge badge-neutral">{{ rule.target_tags | tojson }}</code></td>
                    <td class="font-medium text-primary">{{ rule.percentage }} %</td>
                    <td>
                        <button onclick="deleteRule({{ rule.id }})" class="btn btn-outline" style="color: var(--color-danger); border-color: rgba(239, 68, 68, 0.3);">Smazat</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6" class="text-muted text-center py-4">Zatím nejsou nastavena žádná pravidla.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    async function saveRule() {
        var ruleName = document.getElementById('ruleName').value;
        var sourceTagsStr = document.getElementById('sourceTags').value;
        var targetTagsStr = document.getElementById('targetTags').value;
        var percentageStr = document.getElementById('rulePercentage').value;

        if(!ruleName || !sourceTagsStr || !targetTagsStr || !percentageStr) {
            alert("Prosím vyplňte všechna pole.");
            return;
        }

        try {
            // Check the JSON format
            var sourceTags = JSON.parse(sourceTagsStr);
            var targetTags = JSON.parse(targetTagsStr);
            var percentage = parseFloat(percentageStr);

            var response = await fetch('/api/v1/allocations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    rule_name: ruleName,
                    source_tags: sourceTags,
                    target_tags: targetTags,
                    percentage: percentage
                })
            });

            if (response.ok) {
                // Reload the page
                htmx.ajax('GET', '/ui/allocations', '#app-content');
            } else {
                alert("Chyba při ukládání.");
            }
        } catch (e) {
            alert("Chyba formátu tagů! Musí to být validní JSON, např: {\"env\": \"shared\"}\nDetaily: " + e.message);
        }
    }

    async function deleteRule(id) {
        if (!confirm("Opravdu smazat toto pravidlo?")) return;
        
        var response = await fetch(`/api/v1/allocations/${id}`, { method: 'DELETE' });
        if (response.ok) {
            htmx.ajax('GET', '/ui/allocations', '#app-content');
        } else {
            alert("Chyba při mazání.");
        }
    }
</script>
